name: 24/7 Radio Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout Songs
        uses: actions/checkout@v4

      - name: Install Liquidsoap
        run: sudo apt-get update && sudo apt-get install -y liquidsoap

      - name: Start Streaming to Listen2MyRadio
        run: |
          liquidsoap '
            settings.log.stdout.set(true)
            s = playlist(mode="randomize", ".")
            s = mksafe(s)
            output.shoutcast(
              %mp3(bitrate=128),
              host="://listen2myradio.com",
              port=11851,
              password="Kingofwin",
              name="HaswinPrince Radio",
              genre="Tamil",
              s
            )
          '
