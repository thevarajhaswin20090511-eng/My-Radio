name: 24/7 Radio Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Install Liquidsoap and gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y liquidsoap python3-pip
          pip install gdown

      - name: Download Songs from Google Drive
        run: |
          mkdir -p songs
          gdown --folder "https://google.com" -O songs --remaining-ok

      - name: Start Streaming to Listen2MyRadio
        run: |
          liquidsoap '
            settings.log.stdout.set(true)
            s = playlist(mode="randomize", "./songs")
            s = mksafe(s)
            output.shoutcast(
              %mp3(bitrate=128),
              host="uk16freenew.listen2myradio.com",
              port=11851,
              password="Kingofwin",
              name="HaswinPrince Radio",
              genre="Tamil",
              s
            )
          '
